# Saves aion2.market prices every hour into history/<server>/<day>.csv.
# The Atreia app (formerly Aion2 Craft) downloads these files for its price history and "cheap now" signals.
name: Price archive

on:
  schedule:
    - cron: "45 * * * *" # hourly, after aion2.market refreshes (around :25-:35)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/archive.mjs
      - name: Commit new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "no new prices"; exit 0; fi
          git commit -q -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
